[server]
# Lab local: 0.0.0.0 para laptop + teléfono en la misma WiFi.
# Render/producción: el Procfile / render.yaml sobrescribe con --server.port=$PORT
address = "0.0.0.0"
port = 8501
headless = true
enableStaticServing = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
