# Render Blueprint — TI App (Streamlit PWA monousuario / prueba)
# Docs: https://render.com/docs/blueprint-spec
# Docker: incluye Tesseract (packages.txt solo aplica en Streamlit Cloud).
services:
  - type: web
    name: ti-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Render: SIEMPRE localStorage del dispositivo (este flag se ignora en hosted).
      # Lab PC: "1" = app/data/*.json
      - key: TI_USE_FILESYSTEM
        value: "0"
      # Fin de la prueba (ISO). Tras esta fecha la app muestra bloqueo de licencia.
      - key: FECHA_EXPIRACION_LICENCIA
        value: "2026-10-08"
