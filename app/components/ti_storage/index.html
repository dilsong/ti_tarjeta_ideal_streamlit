<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TI localStorage</title>
  </head>
  <body>
    <script>
      /* Bridge Streamlit ↔ localStorage del origen PWA (window.top). */
      (function () {
        const Streamlit = {
          setComponentReady: function () {
            window.parent.postMessage(
              { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
              "*"
            );
          },
          setFrameHeight: function (height) {
            window.parent.postMessage(
              { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: height },
              "*"
            );
          },
          setComponentValue: function (value) {
            window.parent.postMessage(
              { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: value },
              "*"
            );
          },
          RENDER_EVENT: "streamlit:render",
          events: {
            addEventListener: function (type, callback) {
              window.addEventListener("message", function (event) {
                if (event.data && event.data.type === type) {
                  callback({ detail: event.data });
                }
              });
            },
          },
        };

        function store() {
          // Preferir top: sobrevive redeploys de Render; el iframe del componente es efímero.
          var candidates = [];
          try { candidates.push(window.top); } catch (e) {}
          try { candidates.push(window.parent); } catch (e) {}
          candidates.push(window);
          for (var i = 0; i < candidates.length; i++) {
            try {
              var ls = candidates[i].localStorage;
              if (ls) {
                ls.getItem("__ti_probe__");
                return ls;
              }
            } catch (err) {}
          }
          return null;
        }

        function onRender(event) {
          const args = (event.detail && event.detail.args) || {};
          const key = args.storage_key || "ti_app_v1";
          const mode = args.mode || "get";
          const ls = store();

          try {
            if (!ls) {
              Streamlit.setComponentValue(mode === "set" ? false : "");
              Streamlit.setFrameHeight(0);
              return;
            }
            if (mode === "get") {
              const v = ls.getItem(key);
              Streamlit.setComponentValue(v === null ? "" : v);
            } else if (mode === "set") {
              const val = args.value;
              if (val === null || val === undefined || val === "") {
                ls.removeItem(key);
              } else {
                ls.setItem(key, String(val));
              }
              Streamlit.setComponentValue(true);
            } else {
              Streamlit.setComponentValue(null);
            }
          } catch (err) {
            console.warn("TI localStorage bridge error", err);
            Streamlit.setComponentValue(mode === "set" ? false : "");
          }
          Streamlit.setFrameHeight(0);
        }

        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
        Streamlit.setComponentReady();
        Streamlit.setFrameHeight(0);
      })();
    </script>
  </body>
</html>
